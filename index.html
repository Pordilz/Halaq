<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a6b47" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1a27" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light" />

    <title>Halaq — Shariah Stock Screener for Muslim Investors</title>
    <meta
      name="description"
      content="Halaq screens any stock against AAOIFI and major scholarly standards in seconds. Free, transparent compliance reports for Muslim investors who refuse to compromise."
    />
    <meta
      name="keywords"
      content="halal investing, shariah compliance, AAOIFI, halal stocks, islamic finance, muslim investors, JSE, NASDAQ, NYSE"
    />
    <meta name="author" content="Halaq" />
    <link rel="canonical" href="https://halaq.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Halaq" />
    <meta property="og:title" content="Halaq — Shariah Stock Screener" />
    <meta
      property="og:description"
      content="Screen any stock for Shariah compliance in seconds. AAOIFI-aligned, free forever, built for Muslim investors."
    />
    <meta property="og:image" content="https://halaq.app/og-image.png" />
    <meta property="og:url" content="https://halaq.app/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Halaq — Shariah Stock Screener" />
    <meta
      name="twitter:description"
      content="Screen any stock for Shariah compliance in seconds. AAOIFI-aligned, free forever."
    />
    <meta name="twitter:image" content="https://halaq.app/og-image.png" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Fonts: preconnect + non-blocking load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      />
    </noscript>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Halaq",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any",
        "description": "Shariah-compliance stock screener for Muslim investors. AAOIFI-aligned, with full ratio and business-activity transparency.",
        "url": "https://halaq.app/",
        "offers": [
          {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD",
            "category": "Free"
          }
        ]
      }
    </script>
    <style>
      /* Pre-paint loader so the user never sees a blank page during JS hydration */
      html, body { background-color: #f8f9fb; }
      .halaq-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
        color: #3a4a5c;
      }
      .halaq-boot__spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #dde6f3;
        border-top-color: #1a6b47;
        border-radius: 9999px;
        animation: halaq-spin 0.8s linear infinite;
      }
      .halaq-boot__label {
        font-size: 0.875rem;
        font-weight: 500;
        letter-spacing: 0.01em;
      }
      @keyframes halaq-spin { to { transform: rotate(360deg); } }
      /* Once React mounts, the #root div fills with content and we hide the boot loader. */
      #root:not(:empty) ~ .halaq-boot { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="halaq-boot" aria-hidden="true">
      <div class="halaq-boot__spinner"></div>
      <div class="halaq-boot__label">Loading Halaq…</div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

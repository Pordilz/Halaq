apply plugin: 'com.android.application'

// Capacitor 7's Android library compiles at the Java 21 language level.
// Fail early with an actionable message instead of a cryptic javac error.
if (JavaVersion.current() < JavaVersion.VERSION_21) {
    throw new GradleException(
        "Halaq's Android build requires JDK 21 (Capacitor 7 targets Java 21). " +
        "Found ${JavaVersion.current()}; set JAVA_HOME to a JDK 21 install."
    )
}

// Release signing credentials come from keystore.properties at the project root
// (gitignored). Debug builds intentionally use Android's auto-generated debug
// keystore so local dev / `cap run android` works on any machine with no setup.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.halaq.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.halaq.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            // Uses Android's default debug keystore automatically. Documented
            // choice: keep dev builds keyless; fail fast on release below.
        }
        release {
            // R8 shrinks and obfuscates the Java/Kotlin side of the app.
            // Capacitor ships consumer ProGuard rules for its bridge/plugins.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// Fail fast with a clear message instead of silently emitting an unsigned
// release APK/AAB. Checked at task-graph time so `assembleDebug`, `cap sync`,
// etc. still work on machines with no release keystore.
gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase().contains('release')
    }
    if (!releaseRequested) return

    def requiredKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
    def missingKeys = requiredKeys.findAll { !keystoreProperties[it] }
    if (!keystorePropertiesFile.exists() || missingKeys) {
        throw new GradleException(
            'Release builds require a complete keystore.properties at the Android ' +
            'project root (storeFile, storePassword, keyAlias, keyPassword). ' +
            (missingKeys ? "Missing: ${missingKeys.join(', ')}. " : '') +
            'Debug builds do not need it.'
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
